server:
  port: 8089

spring:
  application:
    name: bmp-notification-service
  # Session 7: pulls hot-reloadable properties from bmp-config-server (config-repo/ in
  # this same GitHub repo). "optional:" means this service still starts fine if the
  # config server isn't running (falls back to this file's own defaults).
  config:
    import: optional:configserver:${BMP_CONFIG_SERVER_URL:http://localhost:8888}
  cloud:
    bus:
      enabled: true
    config:
      # Session 7: HTTP Basic credentials for bmp-config-server (see its own
      # SecurityConfig) — must match BMP_CONFIG_USERNAME/BMP_CONFIG_PASSWORD there.
      username: ${BMP_CONFIG_USERNAME:bmp-config}
      password: ${BMP_CONFIG_PASSWORD:dev-only-config-password-change-in-real-environment}
    stream:
      kafka:
        binder:
          # Same broker as spring.kafka.bootstrap-servers below (NotificationDispatcher's
          # own consumer) — Cloud Bus and the notification Kafka consumer share one Kafka,
          # different topics (bus uses its own internal topic, bmp.events is ours).
          brokers: ${BMP_KAFKA_BOOTSTRAP:localhost:9092}
  # Session 16: same binder-default problem as bmp-auth (see its yml comment) but on the
  # CONSUMER side — the Bus binder defaults deserializers to ByteArray, which would break
  # NotificationDispatcher's @KafkaListener(String payload). Explicit String deserializers.
  kafka:
    bootstrap-servers: ${BMP_KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
  # Session 6 added spring-boot-starter-mail for SmtpEmailSender; Session 14 wired it for
  # real. Boot's MailSenderAutoConfiguration registers a JavaMailSender bean whenever
  # spring.mail.host is set, so the placeholder below keeps the service booting even in
  # log-only mode. To send REAL email, set BMP_EMAIL_PROVIDER=smtp AND the BMP_SMTP_* env
  # vars (see docs/AUTH_API.md / this file's comments). Password is env-var only — never
  # commit it. Defaults target Gmail's SMTP (587/STARTTLS); override host/port for Brevo/SES.
  mail:
    host: ${BMP_SMTP_HOST:smtp.gmail.com}
    port: ${BMP_SMTP_PORT:587}
    username: ${BMP_SMTP_USERNAME:}
    password: ${BMP_SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true          # STARTTLS on 587 — required by Gmail/Brevo/SES/Outlook
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  datasource:
    # Local default (docker-compose) unless overridden — set these 4 env vars to point
    # at a shared cloud instance instead (e.g. your Neon dev branch) without editing this file.
    # See docs/project-management/DATABASE_SETUP.md.
    url: jdbc:postgresql://${BMP_DB_HOST:localhost}:${BMP_DB_PORT:5432}/${BMP_DB_NAME:bmp}${BMP_DB_PARAMS:}
    username: ${BMP_DB_USER:bmp}
    password: ${BMP_DB_PASSWORD:devonly}
    hikari:
      # Kept small on purpose — free-tier cloud Postgres (Neon/Supabase) caps total
      # connections, and 3 devs x 11 services adds up fast if each pool defaults to 10.
      maximum-pool-size: ${BMP_DB_POOL_SIZE:3}
      minimum-idle: 1
  jpa:
    hibernate:
      ddl-auto: validate   # Flyway owns the schema, Hibernate only validates
    open-in-view: false
  flyway:
    table: flyway_schema_history_notification
    schemas: common_schema,notification_schema
    create-schemas: true
    baseline-on-migrate: true

eureka:
  client:
    service-url:
      defaultZone: ${BMP_EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

bmp:
  security:
    internal-service-key: ${BMP_INTERNAL_SERVICE_KEY:dev-only-internal-key-change-in-real-environment}
  notification:
    # Which EmailSender bean is active (Session 14):
    #   log  (default) -> LoggingEmailSender: prints the email to the console. Zero setup,
    #                     what every dev without SMTP creds uses. OTP is still fully testable.
    #   smtp           -> SmtpEmailSender: real delivery via JavaMailSender. Requires the
    #                     spring.mail.* creds above (BMP_SMTP_USERNAME/PASSWORD at minimum).
    # SMS is unaffected — it stays the console-log stub (LoggingSmsSender) until a gateway
    # + DLT are set up (tracked separately).
    email-provider: ${BMP_EMAIL_PROVIDER:log}
    # The "From" address on outgoing mail. For Gmail this MUST equal BMP_SMTP_USERNAME or
    # Gmail rejects the send; for Brevo/SES it must be a verified sender.
    email-from: ${BMP_EMAIL_FROM:no-reply@bemyprofessional.in}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers,env,beans,refresh,busrefresh,threaddump,heapdump
  endpoint:
    health:
      show-details: when-authorized
    loggers:
      enabled: true
  health:
    # No local SMTP server in dev (real creds are a later, service-by-service pass —
    # see spring.mail above) — don't let actuator health flip to DOWN over it.
    mail:
      enabled: false
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}