# ═══════════════════════════════════════════════════════════════════════════════════════════════
# Local SMTP credentials, read directly by Spring. Session 47.
# ═══════════════════════════════════════════════════════════════════════════════════════════════
#
#   1. Copy this file to  local-secrets.properties  (same folder, no ".example")
#   2. Fill in the four values below
#   3. Restart bmp-notification
#
# local-secrets.properties is GITIGNORED. Never commit it, never paste its contents into chat,
# a ticket, or a screenshot.
#
# ── WHY THIS FILE EXISTS, AND NOT JUST local-secrets.ps1 ───────────────────────────────────────
# local-secrets.ps1 sets PowerShell $env: variables. Those only reach processes started from that
# same shell — and IntelliJ run configurations do NOT inherit them. A service launched from the
# IDE therefore saw no credentials no matter how carefully the script had been sourced in a
# terminal, fell back to LoggingEmailSender, and printed every email to the console instead of
# sending it. The symptom is "the notification arrives but no email does", which sends you looking
# at Kafka and the outbox rather than at how the JVM was started.
#
# Spring reads this file whatever launched the JVM. Env vars still win if they're set, so the .ps1
# route keeps working for anyone already using it.
#
# ── GMAIL ─────────────────────────────────────────────────────────────────────────────────────
# The password is a 16-character APP PASSWORD, not the account password. Generate one at
#   myaccount.google.com > Security > 2-Step Verification > App passwords
# Spaces in it are ignored by Gmail; paste it with or without them.
#
# `from` MUST equal `username`. Gmail refuses to send as an address you haven't authenticated as,
# and the refusal (553 5.7.1) looks like a generic send failure.

bmp.smtp.provider=smtp
bmp.smtp.username=your-email@gmail.com
bmp.smtp.password=your-16-char-app-password
bmp.smtp.from=your-email@gmail.com
