server:
  port: 8088

spring:
  application:
    name: bmp-admin-service
  # Session 7: pulls hot-reloadable properties from bmp-config-server (config-repo/ in
  # this same GitHub repo). "optional:" means this service still starts fine if the
  # config server isn't running (falls back to this file's own defaults).
  config:
    import: optional:configserver:${BMP_CONFIG_SERVER_URL:http://localhost:8888}
  cloud:
    bus:
      enabled: true
    config:
      # Session 7: HTTP Basic credentials for bmp-config-server (see its own
      # SecurityConfig) — must match BMP_CONFIG_USERNAME/BMP_CONFIG_PASSWORD there.
      username: ${BMP_CONFIG_USERNAME:bmp-config}
      password: ${BMP_CONFIG_PASSWORD:dev-only-config-password-change-in-real-environment}
    stream:
      kafka:
        binder:
          brokers: ${BMP_KAFKA_BOOTSTRAP:localhost:9092}
  datasource:
    # Local default (docker-compose) unless overridden — set these 4 env vars to point
    # at a shared cloud instance instead (e.g. your Neon dev branch) without editing this file.
    # See docs/project-management/DATABASE_SETUP.md.
    url: jdbc:postgresql://${BMP_DB_HOST:localhost}:${BMP_DB_PORT:5432}/${BMP_DB_NAME:bmp}${BMP_DB_PARAMS:}
    username: ${BMP_DB_USER:bmp}
    password: ${BMP_DB_PASSWORD:devonly}
    hikari:
      # Kept small on purpose — free-tier cloud Postgres (Neon/Supabase) caps total
      # connections, and 3 devs x 11 services adds up fast if each pool defaults to 10.
      maximum-pool-size: ${BMP_DB_POOL_SIZE:3}
      minimum-idle: 1
  jpa:
    hibernate:
      ddl-auto: validate   # Flyway owns the schema, Hibernate only validates
    open-in-view: false
  flyway:
    table: flyway_schema_history_admin
    schemas: common_schema,admin_schema
    create-schemas: true
    baseline-on-migrate: true

bmp:
  security:
    # Session 20: this service's authorization pass. Previously fell back to the code default
    # of /**, which meant NO authentication on anything here. Only the login handshake and
    # health/docs are public now; /api/v1/admin/** is handled by AdminSecurityConfig's own
    # filter chain (a different key and audience from customer tokens).
    public-paths: >-
      /actuator/health, /actuator/info,
      /swagger-ui/**, /swagger-ui.html, /v3/api-docs/**
    internal-service-key: ${BMP_INTERNAL_SERVICE_KEY:dev-only-internal-key-change-in-real-environment}
  auth:
    jwt-secret: ${BMP_JWT_SECRET:dev-only-secret-change-in-real-environment-min-32-bytes-long}

  admin:
    # ⚠️ A DIFFERENT SECRET FROM bmp.auth.jwt-secret, deliberately. If staff and customer tokens
    # shared a key, anything able to forge one could forge the other, and compromising the
    # customer stack would hand over the console. Must be set explicitly in any real environment.
    jwt-secret: ${BMP_ADMIN_JWT_SECRET:dev-only-ADMIN-secret-change-me-min-32-bytes-long-really}

    # 15 minutes. Staff refresh silently while working, so a token found in a log or left in a
    # browser on a shared machine is stale almost immediately.
    access-token-seconds: ${BMP_ADMIN_ACCESS_TOKEN_SECONDS:900}
    # The window between "password correct" and "code correct". Three minutes is enough to open
    # an authenticator app and not much else.
    challenge-token-seconds: ${BMP_ADMIN_CHALLENGE_TOKEN_SECONDS:180}

    # CORS allowlist — exactly one origin. A wildcard would let any site a signed-in staff
    # member visits make authenticated requests on their behalf.
    console-origin: ${BMP_ADMIN_CONSOLE_ORIGIN:http://localhost:5180}

    # One-time bootstrap for the seeded superadmin (see StaffBootstrap). Set both, start the
    # service once, then REMOVE them. They are ignored on every later boot because the account
    # will already have a password — so a stale value in a deploy config cannot reset a live
    # account.
    bootstrap-email: ${BMP_ADMIN_BOOTSTRAP_EMAIL:}
    bootstrap-password: ${BMP_ADMIN_BOOTSTRAP_PASSWORD:}

    # Local-only convenience: create one signed-in-able account per role so least-privilege
    # behaviour can actually be tested. See DevStaffSeeder — it refuses to run unless the
    # datasource is on localhost, regardless of this flag, because the `dev` profile in this
    # repo points at a SHARED Neon branch and a profile-gated seeder would have written
    # known-password admin accounts there.
    #
    # OFF by default. Never set it in any deployed environment.
    dev-staff:
      enabled: ${BMP_ADMIN_DEV_STAFF:false}
      # Optional. Blank => a random one is generated and printed once at startup.
      password: ${BMP_ADMIN_DEV_STAFF_PASSWORD:}

eureka:
  client:
    service-url:
      defaultZone: ${BMP_EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

# ─────────────────────────────────────────────────────────────────────────────────────────────
# THERE WAS A SECOND `bmp:` BLOCK HERE. IT HAS BEEN DELETED. DO NOT ADD ONE BACK.
#
# It was the boilerplate block every service got in Session 6 — `bmp.auth.jwt-secret` and
# `bmp.security.internal-service-key`. Both of those already live in the `bmp:` block above
# (line 46), with identical values, so nothing is lost by removing it.
#
# YAML mappings cannot have duplicate keys, so Spring Boot refused to start at all:
#
#     org.yaml.snakeyaml.constructor.DuplicateKeyException: found duplicate key bmp
#
# The crash is the good outcome. Had SnakeYAML been lenient, the second `bmp:` would have
# REPLACED the first one wholesale — merging is not per-leaf — silently deleting
# `bmp.security.public-paths` and the entire `bmp.admin` section. The service would have booted
# with no admin JWT secret, no console origin and no bootstrap config, and the first sign-in
# attempt would have failed for reasons pointing nowhere near this file.
#
# If you add another `bmp.*` property, put it inside the block at line 46.
# ─────────────────────────────────────────────────────────────────────────────────────────────

# Actuator surface — deliberately NARROWER than the other services.
#
# `env`, `beans`, `threaddump` and `heapdump` were exposed here and are now removed. Only
# /actuator/health and /actuator/info are in `bmp.security.public-paths`; the rest require a
# valid JWT — but "a valid JWT" includes an ordinary CUSTOMER token, because CommonSecurityConfig
# validates signature and expiry, not audience, on non-admin paths.
#
# That combination meant any signed-in customer could have pulled a heap dump from the one
# service that holds `bmp.admin.jwt-secret` in memory — and with that key you can mint a
# super_admin token. `env` leaks the same secret more directly. No feature depended on them.
#
# `refresh` and `busrefresh` stay: Spring Cloud Bus config reload needs them.
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers,refresh,busrefresh
  endpoint:
    health:
      show-details: when-authorized
    loggers:
      enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
