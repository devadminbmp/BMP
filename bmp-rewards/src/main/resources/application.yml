server:
  port: 8087

spring:
  application:
    name: bmp-rewards-service
  # Session 7: pulls hot-reloadable properties from bmp-config-server (config-repo/ in
  # this same GitHub repo). "optional:" means this service still starts fine if the
  # config server isn't running (falls back to this file's own defaults).
  config:
    import: optional:configserver:${BMP_CONFIG_SERVER_URL:http://localhost:8888}
  cloud:
    bus:
      enabled: true
    config:
      # Session 7: HTTP Basic credentials for bmp-config-server (see its own
      # SecurityConfig) — must match BMP_CONFIG_USERNAME/BMP_CONFIG_PASSWORD there.
      username: ${BMP_CONFIG_USERNAME:bmp-config}
      password: ${BMP_CONFIG_PASSWORD:dev-only-config-password-change-in-real-environment}
    stream:
      kafka:
        binder:
          brokers: ${BMP_KAFKA_BOOTSTRAP:localhost:9092}
  # ─────────────────────────────────────────────────────────────────────────────────────────
  # Session 63 — EXPLICIT STRING SERIALIZERS. Do not delete; this is not boilerplate.
  #
  # Spring Cloud Bus's Kafka binder (KafkaBinderEnvironmentPostProcessor) silently DEFAULTS
  # spring.kafka's serializers to ByteArraySerializer when nothing sets them. OutboxKafkaRelay
  # uses KafkaTemplate<String,String> and sends the event type as the key, so without this it
  # fails on every message with:
  #
  #     Can't convert key of class java.lang.String to class
  #     org.apache.kafka.common.serialization.ByteArraySerializer specified in key.serializer
  #
  # This was diagnosed and fixed in bmp-auth in Session 16 — and ONLY in bmp-auth. The outbox
  # table is SHARED (common_schema.outbox) and every service with bmp.outbox.relay.enabled polls
  # it, so an `otp.requested` row written by bmp-auth is routinely picked up by whichever relay
  # polls first. Five services were failing on other services' events and burning the attempt
  # counter, until bmp-auth's relay happened to win a poll.
  #
  # Worth stating: a shared table means shared configuration requirements. Fixing the service
  # where a bug was NOTICED is not the same as fixing the service where it LIVES.
  # ─────────────────────────────────────────────────────────────────────────────────────────
  kafka:
    bootstrap-servers: ${BMP_KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    # ───────────────────────────────────────────────────────────────────────────────────────
    # CONSUMER side, added Session 64 — and it is the SAME BUG as the producer block above,
    # in the other direction.
    #
    # bmp-rewards became a Kafka CONSUMER this session (BookingCompletedListener, which settles
    # referrals when a referred customer's first booking completes). Spring Cloud Bus's binder
    # defaults the consumer deserializers exactly as it defaults the serializers, so without
    # these the listener would fail on every message with a ByteArrayDeserializer mismatch —
    # and it would fail SILENTLY from the outside: referrals would simply never pay, which is
    # indistinguishable from the state this session set out to fix.
    #
    # auto-offset-reset: earliest, matching bmp-notification. A consumer group joining a topic
    # for the first time with 'latest' skips every event published before it started — which for
    # a brand-new consumer means every completed booking so far is silently ignored.
    # ───────────────────────────────────────────────────────────────────────────────────────
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
  datasource:
    # Local default (docker-compose) unless overridden — set these 4 env vars to point
    # at a shared cloud instance instead (e.g. your Neon dev branch) without editing this file.
    # See docs/project-management/DATABASE_SETUP.md.
    url: jdbc:postgresql://${BMP_DB_HOST:localhost}:${BMP_DB_PORT:5432}/${BMP_DB_NAME:bmp}${BMP_DB_PARAMS:}
    username: ${BMP_DB_USER:bmp}
    password: ${BMP_DB_PASSWORD:devonly}
    hikari:
      # Kept small on purpose — free-tier cloud Postgres (Neon/Supabase) caps total
      # connections, and 3 devs x 11 services adds up fast if each pool defaults to 10.
      maximum-pool-size: ${BMP_DB_POOL_SIZE:3}
      minimum-idle: 1
  jpa:
    hibernate:
      ddl-auto: validate   # Flyway owns the schema, Hibernate only validates
    open-in-view: false
  flyway:
    table: flyway_schema_history_rewards
    schemas: common_schema,rewards_schema
    create-schemas: true
    baseline-on-migrate: true

eureka:
  client:
    service-url:
      defaultZone: ${BMP_EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

bmp:
  # ═══════════════════════════════════════════════════════════════════════════════════════════
  # Session 47: the outbox → Kafka relay. THIS WAS OFF, AND IT MEANT NO EMAIL EVER ARRIVED.
  # ═══════════════════════════════════════════════════════════════════════════════════════════
  # OutboxKafkaRelay is @ConditionalOnProperty(havingValue = "true") with NO matchIfMissing, so
  # omitting this key doesn't disable a feature loudly — the bean is simply never created and
  # nothing anywhere says so. bmp-rewards publishes CouponRequestRaised/Decided, and without the relay those rows are
  # written to the outbox table, committed, and then sit there forever: an offer is approved and the owner never hears.
  #
  # bmp-auth has had this since Session 16 (which is why OTP email works and nothing else did).
  # The other publishing services were never given it — a per-service opt-in that three services
  # silently opted out of.
  #
  # Requires: Kafka up (docker compose) AND @EnableScheduling on the application class, since
  # the relay is a @Scheduled poll. Both are now in place.
  outbox:
    relay:
      enabled: ${BMP_OUTBOX_RELAY_ENABLED:true}
  # Session 6: shared JWT validation (com.bmp.common.security.CommonSecurityConfig).
  auth:
    jwt-secret: ${BMP_JWT_SECRET:dev-only-secret-change-in-real-environment-min-32-bytes-long}
  security:
    internal-service-key: ${BMP_INTERNAL_SERVICE_KEY:dev-only-internal-key-change-in-real-environment}
    # Session 22: this service's authorization pass.
    #
    # public-paths previously fell back to the code default of /**, which meant NOTHING here
    # was authenticated — the principal was always null, so the @PreAuthorize on the coupon
    # endpoints could not have worked, and /internal/redeem would have been callable by
    # anyone who could reach the port. Coupons are money; that is not a theoretical hole.
    #
    # Nothing about rewards is public: you must be signed in to quote a code, and only
    # ROLE_SERVICE may redeem one.
    public-paths: >-
      /actuator/health, /actuator/info,
      /swagger-ui/**, /swagger-ui.html, /v3/api-docs/**

# Session 7/22: actuator surface — only health and info are public now (see
# bmp.security.public-paths above); env/beans/heapdump require a token like everything else.
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers,env,beans,refresh,busrefresh,threaddump,heapdump
  endpoint:
    health:
      show-details: when-authorized
    loggers:
      enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
