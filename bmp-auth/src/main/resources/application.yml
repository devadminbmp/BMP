server:
  port: 8081

spring:
  application:
    name: bmp-auth-service
  # Session 7: pulls hot-reloadable properties from bmp-config-server (config-repo/ in this
  # same GitHub repo). "optional:" means this service still starts fine if the config
  # server isn't running (falls back to this file's own defaults) — not a hard dependency.
  config:
    import: optional:configserver:${BMP_CONFIG_SERVER_URL:http://localhost:8888}
  cloud:
    bus:
      enabled: true
    config:
      # Session 7: HTTP Basic credentials for bmp-config-server (see its own
      # SecurityConfig) — must match BMP_CONFIG_USERNAME/BMP_CONFIG_PASSWORD there.
      username: ${BMP_CONFIG_USERNAME:bmp-config}
      password: ${BMP_CONFIG_PASSWORD:dev-only-config-password-change-in-real-environment}
    stream:
      kafka:
        binder:
          brokers: ${BMP_KAFKA_BOOTSTRAP:localhost:9092}
  datasource:
    # Local default (docker-compose) unless overridden — set these 4 env vars to point
    # at a shared cloud instance instead (e.g. your Neon dev branch) without editing this file.
    # See docs/project-management/DATABASE_SETUP.md.
    url: jdbc:postgresql://${BMP_DB_HOST:localhost}:${BMP_DB_PORT:5432}/${BMP_DB_NAME:bmp}${BMP_DB_PARAMS:}
    username: ${BMP_DB_USER:bmp}
    password: ${BMP_DB_PASSWORD:devonly}
    hikari:
      # Kept small on purpose — free-tier cloud Postgres (Neon/Supabase) caps total
      # connections, and 3 devs x 11 services adds up fast if each pool defaults to 10.
      maximum-pool-size: ${BMP_DB_POOL_SIZE:3}
      minimum-idle: 1
  jpa:
    hibernate:
      ddl-auto: validate   # Flyway owns the schema, Hibernate only validates
    open-in-view: false
  flyway:
    table: flyway_schema_history_auth
    schemas: user_schema
    create-schemas: true
    # baseline-on-migrate lets this service's Flyway coexist with bmp-user-service's
    # Flyway history in the same physical schema during local dev — confirm this is
    # still correct once each service gets its own physical database.
    baseline-on-migrate: true

eureka:
  client:
    service-url:
      defaultZone: ${BMP_EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

bmp:
  auth:
    jwt-secret: ${BMP_JWT_SECRET:dev-only-secret-change-in-real-environment-min-32-bytes-long}
    access-token-ttl-seconds: ${BMP_ACCESS_TOKEN_TTL_SECONDS:900}
    refresh-token-ttl-days: ${BMP_REFRESH_TOKEN_TTL_DAYS:30}
    otp-ttl-minutes: ${BMP_OTP_TTL_MINUTES:5}
    otp-max-attempts: ${BMP_OTP_MAX_ATTEMPTS:5}
    otp-lockout-minutes: ${BMP_OTP_LOCKOUT_MINUTES:15}
    # Google Sign-In OAuth 2.0 Client ID (Google Cloud project "BMP2026", Web client).
    # NOT a secret — a client id is sent to browsers/apps by design, so it's safe to keep
    # in the repo. GoogleTokenVerifier checks that a submitted Google ID token's `aud`
    # claim equals this value (see /oauth2/google). Env-var overridable per environment;
    # when Android/iOS clients are added they each get their OWN client id (different
    # `aud`) and the verifier will need to accept a LIST — flagged in AuthService/CONTEXT.
    google-client-id: ${BMP_GOOGLE_CLIENT_ID:379818619052-ns0mpj0hf4uucc48d21f9us7uqsr6gvb.apps.googleusercontent.com}
    # Dev convenience ONLY — this profile is what runs with no SPRING_PROFILES_ACTIVE
    # set, i.e. every local dev machine. Lets any dev log in as any phone number with
    # this fixed code instead of digging the real OTP out of bmp-notification's console
    # log every time. Deliberately absent from application-staging.yml/application-prod.yml
    # — @Value("${bmp.auth.dev-master-otp:}") in AuthService defaults to blank (disabled)
    # when this key isn't set at all, so it never activates outside local dev.
    dev-master-otp: ${BMP_DEV_MASTER_OTP:000000}
  security:
    internal-service-key: ${BMP_INTERNAL_SERVICE_KEY:dev-only-internal-key-change-in-real-environment}
    # Session 14: the token-ISSUING endpoints are public (they can't require a token you
    # don't have yet); everything else — notably GET /api/v1/auth/me — requires a valid
    # Bearer token. Listed explicitly rather than the /** default so /me is actually gated.
    public-paths: >-
      /api/v1/auth/otp/request,
      /api/v1/auth/otp/verify,
      /api/v1/auth/oauth2/**,
      /api/v1/auth/refresh,
      /api/v1/auth/logout,
      /actuator/health,
      /actuator/info,
      /swagger-ui/**,
      /swagger-ui.html,
      /v3/api-docs/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers,env,beans,refresh,busrefresh,threaddump,heapdump
  endpoint:
    health:
      show-details: when-authorized
    loggers:
      enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}