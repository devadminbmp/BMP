server:
  port: 8089

spring:
  application:
    name: bmp-notification-service
  # Session 7: pulls hot-reloadable properties from bmp-config-server (config-repo/ in
  # this same GitHub repo). "optional:" means this service still starts fine if the
  # config server isn't running (falls back to this file's own defaults).
  config:
    # Session 47: read SMTP credentials from a gitignored FILE as well as from env vars.
    #
    # Why: local-secrets.ps1 sets PowerShell $env: variables, which only reach processes started
    # from that same shell. IntelliJ run configurations do NOT inherit them — so a service started
    # from the IDE saw no credentials however carefully the script had been sourced elsewhere, and
    # silently fell back to LoggingEmailSender. That is exactly the "notification received, no
    # email" symptom.
    #
    # A file removes the whole class of problem: Spring reads it regardless of how the JVM was
    # launched. Both paths are tried because the working directory is the repo root when Maven
    # runs it and the MODULE directory when IntelliJ does.
    #
    # `optional:` means a missing file is not an error — teammates who use env vars are unaffected.
    import:
      - optional:configserver:${BMP_CONFIG_SERVER_URL:http://localhost:8888}
      - optional:file:./local-secrets.properties
      - optional:file:../local-secrets.properties
  cloud:
    bus:
      enabled: true
    config:
      # Session 7: HTTP Basic credentials for bmp-config-server (see its own
      # SecurityConfig) — must match BMP_CONFIG_USERNAME/BMP_CONFIG_PASSWORD there.
      username: ${BMP_CONFIG_USERNAME:bmp-config}
      password: ${BMP_CONFIG_PASSWORD:dev-only-config-password-change-in-real-environment}
    stream:
      kafka:
        binder:
          # Same broker as spring.kafka.bootstrap-servers below (NotificationDispatcher's
          # own consumer) — Cloud Bus and the notification Kafka consumer share one Kafka,
          # different topics (bus uses its own internal topic, bmp.events is ours).
          brokers: ${BMP_KAFKA_BOOTSTRAP:localhost:9092}
  # Session 16: same binder-default problem as bmp-auth (see its yml comment) but on the
  # CONSUMER side — the Bus binder defaults deserializers to ByteArray, which would break
  # NotificationDispatcher's @KafkaListener(String payload). Explicit String deserializers.
  kafka:
    bootstrap-servers: ${BMP_KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
  # Session 6 added spring-boot-starter-mail for SmtpEmailSender; Session 14 wired it for
  # real. Boot's MailSenderAutoConfiguration registers a JavaMailSender bean whenever
  # spring.mail.host is set, so the placeholder below keeps the service booting even in
  # log-only mode. To send REAL email, set BMP_EMAIL_PROVIDER=smtp AND the BMP_SMTP_* env
  # vars (see docs/AUTH_API.md / this file's comments). Password is env-var only — never
  # commit it. Defaults target Gmail's SMTP (587/STARTTLS); override host/port for Brevo/SES.
  mail:
    host: ${BMP_SMTP_HOST:smtp.gmail.com}
    port: ${BMP_SMTP_PORT:587}
    # Env var wins; falls back to local-secrets.properties; then empty. Written as a placeholder
    # CHAIN rather than relying on which document "wins" — config precedence between an importing
    # file and an imported one is subtle, and credentials are the wrong place to be subtle.
    username: ${BMP_SMTP_USERNAME:${bmp.smtp.username:}}
    password: ${BMP_SMTP_PASSWORD:${bmp.smtp.password:}}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true          # STARTTLS on 587 — required by Gmail/Brevo/SES/Outlook
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  datasource:
    # Local default (docker-compose) unless overridden — set these 4 env vars to point
    # at a shared cloud instance instead (e.g. your Neon dev branch) without editing this file.
    # See docs/project-management/DATABASE_SETUP.md.
    url: jdbc:postgresql://${BMP_DB_HOST:localhost}:${BMP_DB_PORT:5432}/${BMP_DB_NAME:bmp}${BMP_DB_PARAMS:}
    username: ${BMP_DB_USER:bmp}
    password: ${BMP_DB_PASSWORD:devonly}
    hikari:
      # Kept small on purpose — free-tier cloud Postgres (Neon/Supabase) caps total
      # connections, and 3 devs x 11 services adds up fast if each pool defaults to 10.
      maximum-pool-size: ${BMP_DB_POOL_SIZE:3}
      minimum-idle: 1
  jpa:
    hibernate:
      ddl-auto: validate   # Flyway owns the schema, Hibernate only validates
    open-in-view: false
  flyway:
    table: flyway_schema_history_notification
    schemas: common_schema,notification_schema
    create-schemas: true
    baseline-on-migrate: true

eureka:
  client:
    service-url:
      defaultZone: ${BMP_EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

bmp:
  security:
    # ═════════════════════════════════════════════════════════════════════════════════════════
    # Session 29 authorization pass.
    #
    # NOTHING here is public. The notification log records who was sent what, to which phone
    # number and email address — it is a list of every customer's contact details plus their
    # activity, which is a worse leak than most of the tables it describes.
    #
    # This service had no public-paths, so the /** default applied and all seven endpoints were
    # open, including GET /notifications/log (the whole table) and
    # GET /notifications/recipient/{userId} (one person's entire message history).
    #
    # It is written to by other SERVICES, never by a browser or an app, so there is no
    # end-user role that should reach it at all.
    # ═════════════════════════════════════════════════════════════════════════════════════════
    public-paths: >-
      /actuator/health, /actuator/info,
      /swagger-ui/**, /swagger-ui.html, /v3/api-docs/**
    internal-service-key: ${BMP_INTERNAL_SERVICE_KEY:dev-only-internal-key-change-in-real-environment}
  notification:
    # ── PUSH (Expo). Session 64. ─────────────────────────────────────────────────────────────
    # false registers LoggingPushSender (logs, sends nothing); true registers ExpoPushSender.
    # One flag, two mutually exclusive beans — see LoggingPushSender for why that beats @Primary.
    #
    # No credentials needed: Expo accepts unauthenticated sends to a valid ExponentPushToken,
    # because the token IS the capability. There is no account to compromise.
    #
    # Push is always an ADDITION to email, never a replacement — see PushSender.
    push:
      enabled: ${BMP_PUSH_ENABLED:false}

    # Which EmailSender bean is active (Session 14):
    #   log  (default) -> LoggingEmailSender: prints the email to the console. Zero setup,
    #                     what every dev without SMTP creds uses. OTP is still fully testable.
    #   smtp           -> SmtpEmailSender: real delivery via JavaMailSender. Requires the
    #                     spring.mail.* creds above (BMP_SMTP_USERNAME/PASSWORD at minimum).
    # SMS is unaffected — it stays the console-log stub (LoggingSmsSender) until a gateway
    # + DLT are set up (tracked separately).
    email-provider: ${BMP_EMAIL_PROVIDER:${bmp.smtp.provider:log}}
    # Where "somebody needs to look at this" mail goes — today, the coupon-approval queue.
    #
    # ONE address, deliberately, not per-admin routing: there is no admin distribution list in
    # the system, and encoding whose problem each request is duplicates what the queue already
    # does. An address a human watches beats a routing rule nobody maintains.
    #
    # Empty by default so a dev machine never emails anyone. Unset in a real environment means
    # the approval queue goes unwatched — NotificationDispatcher logs a warning rather than
    # failing quietly, but set it before launch.
    # ═══════════════════════════════════════════════════════════════════════════════════════
    # Where "somebody needs to look at this" mail goes: new salon requests, coupon requests.
    # ═══════════════════════════════════════════════════════════════════════════════════════
    # Session 48 — this defaulted to EMPTY, and the effect was silent. Both handlers check for a
    # blank address, log "nobody has been told", and return. So a salon owner signed up, the
    # review was queued, the owner got their receipt — and no human was ever told there was
    # anything to approve. The queue simply waited for someone to think of opening it.
    #
    # A notification channel with no recipient is not a disabled feature, it is a feature that
    # reports success while doing nothing. Given a default, the dev environment now works out of
    # the box; override BMP_OPS_EMAIL for anything real.
    #
    # Not a personal address by choice — this is committed config. devadmin.bmp@gmail.com is the
    # same account the seeded super-admin uses, so it is already the address watching this system.
    ops-email: ${BMP_OPS_EMAIL:devadmin.bmp@gmail.com}
    # The "From" address on outgoing mail. For Gmail this MUST equal BMP_SMTP_USERNAME or
    # Gmail rejects the send; for Brevo/SES it must be a verified sender.
    email-from: ${BMP_EMAIL_FROM:${bmp.smtp.from:no-reply@bemyprofessional.in}}

    # ═════════════════════════════════════════════════════════════════════════════════════════
    # Session 43 — delivery channels.
    #
    # EMAIL IS THE ONLY LIVE CHANNEL. OTPs really are delivered over it (email-provider: smtp).
    # The two below are wired at the correct call sites in NotificationDispatcher but send
    # nothing — they are stubs, and both are blocked on external setup, not on code:
    #
    #   sms      — blocked on TRAI DLT registration. In India you cannot send transactional SMS
    #              by buying an API key: the entity, the sender header and EVERY template must be
    #              registered and approved first. No credential makes this work until that's done.
    #
    #   whatsapp — blocked on a WhatsApp Business account plus template approval from Meta. An
    #              OTP is unsolicited by definition, so it must go out as a pre-approved template
    #              (see WhatsAppSender for why that shapes the interface).
    #
    # Both default to FALSE and the stubs honour the flag — a channel described as off is silent.
    # Turning one on today only makes the stub log what it WOULD send, which is the point: you
    # can see the traffic you're about to start paying for before you pay for it.
    #
    # To go live on either: add a real @Service implementing SmsSender / WhatsAppSender, mark it
    # @Primary, and flip the flag. No call-site changes.
    # ═════════════════════════════════════════════════════════════════════════════════════════
    channels:
      sms:
        enabled: ${BMP_SMS_ENABLED:false}
      whatsapp:
        enabled: ${BMP_WHATSAPP_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers,env,beans,refresh,busrefresh,threaddump,heapdump
  endpoint:
    health:
      show-details: when-authorized
    loggers:
      enabled: true
  health:
    # No local SMTP server in dev (real creds are a later, service-by-service pass —
    # see spring.mail above) — don't let actuator health flip to DOWN over it.
    mail:
      enabled: false
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}