server:
  port: 8080

spring:
  application:
    name: api-gateway
  # Session 7: hot-reloadable route table from bmp-config-server — a route change (new
  # service, new path prefix) can go out via a bus refresh instead of a redeploy.
  config:
    import: optional:configserver:${BMP_CONFIG_SERVER_URL:http://localhost:8888}
  cloud:
    bus:
      enabled: true
    config:
      # Session 7: HTTP Basic credentials for bmp-config-server (see its own
      # SecurityConfig) — must match BMP_CONFIG_USERNAME/BMP_CONFIG_PASSWORD there.
      username: ${BMP_CONFIG_USERNAME:bmp-config}
      password: ${BMP_CONFIG_PASSWORD:dev-only-config-password-change-in-real-environment}
    stream:
      kafka:
        binder:
          brokers: ${BMP_KAFKA_BOOTSTRAP:localhost:9092}
    gateway:
      # CORS (Session 15, frontend kickoff): the React Native WEB build runs in a browser,
      # which enforces CORS — without this block every fetch from the Expo web app is
      # blocked before it even reaches a service. Configured ONCE here at the gateway (the
      # only origin browsers talk to), NOT per-service: services behind the gateway never
      # see browser traffic directly, and one config can't drift into nine.
      # - allowedOriginPatterns (not allowedOrigins) so a port wildcard works: Expo's dev
      #   server picks its own port (8081 default, but it moves when that's busy — and
      #   bmp-auth already owns 8081 on a dev machine), so pin to "any localhost port".
      # - allowCredentials stays false: auth is a Bearer header, not cookies, so we don't
      #   need credentialed CORS (and browsers forbid combining it with wildcards anyway).
      # - Native Android/iOS apps don't enforce CORS; this is purely for web.
      # - Production: replace the localhost pattern with the real web app origin(s).
      globalcors:
        add-to-simple-url-handler-mapping: true   # answers preflights on unmatched paths too
        cors-configurations:
          '[/**]':
            allowedOriginPatterns:
              - "http://localhost:[*]"
              - "http://127.0.0.1:[*]"
            allowedMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
            allowedHeaders: "*"
            exposedHeaders: [Authorization]
            allowCredentials: false
            maxAge: 3600
      # discovery.locator would auto-route by service name alone; explicit routes below
      # instead, so the public URL path prefixes stay stable and readable regardless of
      # what each service internally calls itself.
      routes:
        - id: auth-service
          uri: lb://bmp-auth-service
          predicates:
            - Path=/api/v1/auth/**

        - id: user-service
          uri: lb://bmp-user-service
          predicates:
            - Path=/api/v1/users/**

        - id: salon-service
          uri: lb://bmp-salon-service
          predicates:
            # /api/v1/availability/** added Session 8 (availability algorithm)
            - Path=/api/v1/salons/**,/api/v1/stylists/**,/api/v1/availability/**

        - id: booking-service
          uri: lb://bmp-booking-service
          predicates:
            - Path=/api/v1/bookings/**

        - id: payment-service
          uri: lb://bmp-payment-service
          predicates:
            - Path=/api/v1/payment-orders/**

        - id: review-service
          uri: lb://bmp-review-service
          predicates:
            - Path=/api/v1/reviews/**

        - id: rewards-service
          uri: lb://bmp-rewards-service
          predicates:
            - Path=/api/v1/coupons/**,/api/v1/wallet/**,/api/v1/referrals/**

        - id: admin-service
          uri: lb://bmp-admin-service
          predicates:
            - Path=/api/v1/audit-log/**,/api/v1/staff/**,/api/v1/support-tickets/**

        - id: notification-service
          uri: lb://bmp-notification-service
          predicates:
            - Path=/api/v1/notifications/**

eureka:
  client:
    service-url:
      defaultZone: ${BMP_EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway,busrefresh
  endpoint:
    health:
      show-details: when-authorized

info:
  app:
    name: ${spring.application.name}