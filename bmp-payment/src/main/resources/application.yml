server:
  port: 8085

spring:
  application:
    name: bmp-payment-service
  # Session 7: pulls hot-reloadable properties from bmp-config-server (config-repo/ in
  # this same GitHub repo). "optional:" means this service still starts fine if the
  # config server isn't running (falls back to this file's own defaults).
  config:
    import: optional:configserver:${BMP_CONFIG_SERVER_URL:http://localhost:8888}
  cloud:
    bus:
      enabled: true
    config:
      # Session 7: HTTP Basic credentials for bmp-config-server (see its own
      # SecurityConfig) — must match BMP_CONFIG_USERNAME/BMP_CONFIG_PASSWORD there.
      username: ${BMP_CONFIG_USERNAME:bmp-config}
      password: ${BMP_CONFIG_PASSWORD:dev-only-config-password-change-in-real-environment}
    stream:
      kafka:
        binder:
          brokers: ${BMP_KAFKA_BOOTSTRAP:localhost:9092}
  # ─────────────────────────────────────────────────────────────────────────────────────────
  # Session 63 — EXPLICIT STRING SERIALIZERS. Do not delete; this is not boilerplate.
  #
  # Spring Cloud Bus's Kafka binder (KafkaBinderEnvironmentPostProcessor) silently DEFAULTS
  # spring.kafka's serializers to ByteArraySerializer when nothing sets them. OutboxKafkaRelay
  # uses KafkaTemplate<String,String> and sends the event type as the key, so without this it
  # fails on every message with:
  #
  #     Can't convert key of class java.lang.String to class
  #     org.apache.kafka.common.serialization.ByteArraySerializer specified in key.serializer
  #
  # This was diagnosed and fixed in bmp-auth in Session 16 — and ONLY in bmp-auth. The outbox
  # table is SHARED (common_schema.outbox) and every service with bmp.outbox.relay.enabled polls
  # it, so an `otp.requested` row written by bmp-auth is routinely picked up by whichever relay
  # polls first. Five services were failing on other services' events and burning the attempt
  # counter, until bmp-auth's relay happened to win a poll.
  #
  # Worth stating: a shared table means shared configuration requirements. Fixing the service
  # where a bug was NOTICED is not the same as fixing the service where it LIVES.
  # ─────────────────────────────────────────────────────────────────────────────────────────
  kafka:
    bootstrap-servers: ${BMP_KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  datasource:
    # Local default (docker-compose) unless overridden — set these 4 env vars to point
    # at a shared cloud instance instead (e.g. your Neon dev branch) without editing this file.
    # See docs/project-management/DATABASE_SETUP.md.
    url: jdbc:postgresql://${BMP_DB_HOST:localhost}:${BMP_DB_PORT:5432}/${BMP_DB_NAME:bmp}${BMP_DB_PARAMS:}
    username: ${BMP_DB_USER:bmp}
    password: ${BMP_DB_PASSWORD:devonly}
    hikari:
      # Kept small on purpose — free-tier cloud Postgres (Neon/Supabase) caps total
      # connections, and 3 devs x 11 services adds up fast if each pool defaults to 10.
      maximum-pool-size: ${BMP_DB_POOL_SIZE:3}
      minimum-idle: 1
  jpa:
    hibernate:
      ddl-auto: validate   # Flyway owns the schema, Hibernate only validates
    open-in-view: false
  flyway:
    table: flyway_schema_history_payment
    schemas: common_schema,payment_schema
    create-schemas: true
    baseline-on-migrate: true

eureka:
  client:
    service-url:
      defaultZone: ${BMP_EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

bmp:
  auth:
    jwt-secret: ${BMP_JWT_SECRET:dev-only-secret-change-in-real-environment-min-32-bytes-long}
  security:
    # ═════════════════════════════════════════════════════════════════════════════════════════
    # Session 29 authorization pass.
    #
    # NOTHING in this service is public. It handles money, and every endpoint either reads a
    # payment order (which reveals what a customer paid and for what) or writes one.
    #
    # This service previously had no public-paths at all, so the /** default applied and all
    # four endpoints were open — including PUT /payment-orders/{id}/status, a dev-only status
    # setter that can mark a payment CAPTURED. On a public VM that is a way to confirm bookings
    # without paying for them. It is now SERVICE-role only; see PaymentOrderController.
    # ═════════════════════════════════════════════════════════════════════════════════════════
    #
    # SESSION 50 — /payment-orders/webhook IS PUBLIC, AND MUST BE.
    #
    # Razorpay calls it from its own servers holding no BMP credential, so there is no token to
    # require. Its defence is the HMAC-SHA256 signature check in WebhookService, not this list.
    #
    # Two things follow, and both matter:
    #   1. bmp.payment.razorpay.webhook-secret MUST be set in production. Unset, the verifier
    #      refuses every webhook — payments stop, which someone notices in minutes. That is the
    #      safe failure; the unsafe one is accepting forged webhooks, which nobody notices.
    #   2. This is an EXACT path, not a prefix. `/api/v1/payment-orders/**` here would re-open
    #      the dev-only status setter that can mark a payment captured — the very hole the note
    #      above records closing.
    public-paths: >-
      /api/v1/payment-orders/webhook,
      /actuator/health, /actuator/info,
      /swagger-ui/**, /swagger-ui.html, /v3/api-docs/**
    internal-service-key: ${BMP_INTERNAL_SERVICE_KEY:dev-only-internal-key-change-in-real-environment}

  # ═══════════════════════════════════════════════════════════════════════════════════════════
  # Session 50: the outbox → Kafka relay. WITHOUT THIS, NO PAYMENT EVER CONFIRMS A BOOKING.
  # ═══════════════════════════════════════════════════════════════════════════════════════════
  # OutboxKafkaRelay is @ConditionalOnProperty(havingValue = "true") with NO matchIfMissing, so
  # omitting this key does not disable a feature loudly — the bean is simply never created and
  # nothing anywhere says so.
  #
  # bmp-payment now publishes payment.captured, which is the event that moves a booking from
  # PENDING to CONFIRMED and turns its invoice into a receipt. Without the relay those rows are
  # written to the outbox, committed, and sit there forever: the customer's money has been taken,
  # the commission ledger says BMP earned it, and the booking still reads "awaiting payment".
  #
  # That is the worst version of this bug the codebase has had. Session 47 found three services
  # silently opted out of a per-service flag; this one would have been the fourth, on the money
  # path.
  #
  # Requires: Kafka up (docker compose) AND @EnableScheduling on BmpPaymentApplication, since the
  # relay is a @Scheduled poll. Both are now in place.
  outbox:
    relay:
      enabled: ${BMP_OUTBOX_RELAY_ENABLED:true}

  # ═══════════════════════════════════════════════════════════════════════════════════════════
  # Session 50: which payment gateway is live.
  # ═══════════════════════════════════════════════════════════════════════════════════════════
  # 'fake' takes no money and confirms everything — see FakePaymentGateway. It refuses to load
  # under the prod profile and logs a warning on every call, but the real guard is this line.
  #
  # 'razorpay' has REAL signature verification and REAL payload parsing; its two HTTP calls
  # (create-order, refund) are not written yet and throw with a message saying so, rather than
  # returning a fabricated order id that fails later and less clearly.
  payment:
    gateway: ${BMP_PAYMENT_GATEWAY:fake}
    razorpay:
      # NEVER commit these. They belong in the gitignored local secrets file, alongside the mail
      # password — same rule, same reason.
      key-id: ${RAZORPAY_KEY_ID:}
      key-secret: ${RAZORPAY_KEY_SECRET:}
      # Unset => the verifier refuses EVERY webhook. That is the safe failure: payments stop and
      # someone notices in minutes. The unsafe one is accepting forged webhooks, which is silent.
      webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}

# Session 7: actuator surface — health/info are public (see bmp.security.public-paths
# default of /** for this service; tighten alongside that service's own authorization
# pass). env/beans/heapdump are powerful; not yet gated per-path here since this service
# hasn't had its Session 6-style authorization pass — flagged, not silently left open.
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers,env,beans,refresh,busrefresh,threaddump,heapdump
  endpoint:
    health:
      show-details: when-authorized
    loggers:
      enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
